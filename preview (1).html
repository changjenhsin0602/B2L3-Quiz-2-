<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文法二互動式測驗｜間接問句</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans TC", Arial, sans-serif;
      line-height: 1.6;
      background: #f4f7fb;
      color: #1f2937;
    }
    .container {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 20px;
      margin-bottom: 20px;
    }
    h1, h2, h3 { margin-top: 0; }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }
    .question {
      padding: 18px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      margin-bottom: 16px;
      background: #fcfdff;
    }
    .question-number {
      font-weight: 700;
      margin-bottom: 8px;
    }
    .option {
      display: block;
      padding: 10px 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid #dbe3ef;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .option:hover {
      background: #f8fbff;
      border-color: #93c5fd;
    }
    .option input {
      margin-right: 8px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary {
      background: #2563eb;
      color: white;
    }
    .secondary {
      background: #e5e7eb;
      color: #111827;
    }
    .danger {
      background: #ef4444;
      color: white;
    }
    .result-box {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
    }
    .correct {
      background: #ecfdf5 !important;
      border-color: #10b981 !important;
    }
    .incorrect {
      background: #fef2f2 !important;
      border-color: #ef4444 !important;
    }
    .answer-note {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #f8fafc;
      border-left: 4px solid #94a3b8;
      font-size: 15px;
    }
    .top-note {
      color: #475569;
      font-size: 15px;
    }
    .score-line {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .footer-note {
      color: #64748b;
      font-size: 14px;
      margin-top: 10px;
    }
    .hidden {
      display: none;
    }
    @media print {
      .toolbar, .no-print { display: none !important; }
      body { background: white; }
      .card { box-shadow: none; border: 1px solid #ddd; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>文法二互動式測驗｜間接問句</h1>
      <p class="top-note">
        本測驗依照你目前這份「文法二：間接問句」考卷製作，共 15 題選擇題。學生可先輸入資料，再作答並立即查看成績與正確答案。
      </p>

      <div class="meta-grid">
        <div>
          <label for="studentClass">班級</label>
          <input id="studentClass" type="text" placeholder="例如：二年甲班">
        </div>
        <div>
          <label for="studentName">姓名</label>
          <input id="studentName" type="text" placeholder="請輸入姓名">
        </div>
        <div>
          <label for="studentSeat">座號</label>
          <input id="studentSeat" type="text" placeholder="請輸入座號">
        </div>
      </div>

      <div class="toolbar">
        <button class="primary" onclick="submitQuiz()">提交測驗</button>
        <button class="secondary" onclick="resetQuiz()">重新作答</button>
        <button class="danger" onclick="toggleAnswers()">顯示／隱藏答案解析</button>
      </div>

      <div id="resultBox" class="result-box"></div>
      <div class="footer-note no-print">建議上傳到 GitHub Pages：把這個檔案命名為 <strong>index.html</strong>。</div>
    </div>

    <div id="quizContainer" class="card"></div>
  </div>

  <script>
    const questions = [
      {
        id: 1,
        question: "「間接問句」在句中的功能，和下列哪一種子句相同？",
        options: {
          A: "形容詞子句",
          B: "副詞子句",
          C: "名詞子句",
          D: "分詞構句"
        },
        answer: "C",
        explanation: "間接問句在句中常當名詞子句使用，可作動詞受詞。"
      },
      {
        id: 2,
        question: "下列哪一個是間接問句的正確語序？",
        options: {
          A: "wh- + be + S",
          B: "do + S + V",
          C: "be + wh- + S",
          D: "wh- + S + be"
        },
        answer: "D",
        explanation: "間接問句要用陳述句語序，所以是 wh- + S + be / V。"
      },
      {
        id: 3,
        question: "下列哪一句是正確的間接問句？",
        options: {
          A: "Do you know where he is?",
          B: "Do you know where is he?",
          C: "Do you know where does he go?",
          D: "Do you know where did he go?"
        },
        answer: "A",
        explanation: "間接問句不可倒裝，要用 where he is。"
      },
      {
        id: 4,
        question: "Tell me _____ .",
        options: {
          A: "what does your name mean",
          B: "what is your name",
          C: "what your name",
          D: "what your name is"
        },
        answer: "D",
        explanation: "間接問句要用陳述句語序：what your name is。"
      },
      {
        id: 5,
        question: "I don’t know _____ yesterday.",
        options: {
          A: "where he went",
          B: "where did he go",
          C: "where does he go",
          D: "where he go"
        },
        answer: "A",
        explanation: "did 要拿掉，go 改成過去式 went。"
      },
      {
        id: 6,
        question: "由直接問句改為間接問句時，若原句有 do / does / did，應該怎麼處理？",
        options: {
          A: "改成 be 動詞",
          B: "刪掉 do / does / did，並把動詞改成正確時態",
          C: "保留 do / does / did 不變",
          D: "直接把 do / does / did 移到句尾"
        },
        answer: "B",
        explanation: "這是你這份文法重點中的核心規則。"
      },
      {
        id: 7,
        question: "Where did you go yesterday? 改成間接問句後，哪一句正確？",
        options: {
          A: "Tell me where are you yesterday.",
          B: "Tell me where did you go yesterday.",
          C: "Tell me where you went yesterday.",
          D: "Tell me where you go yesterday."
        },
        answer: "C",
        explanation: "did 拿掉，go 改成 went，並用陳述句語序。"
      },
      {
        id: 8,
        question: "Can you tell me _____ a student?",
        options: {
          A: "she is",
          B: "is she",
          C: "whether is she",
          D: "she be"
        },
        answer: "A",
        explanation: "這裡後面接的是間接問句內容，要用 she is。"
      },
      {
        id: 9,
        question: "下列哪一句正確使用 whether / if？",
        options: {
          A: "I wonder if is he ready.",
          B: "I wonder whether is he ready.",
          C: "I wonder if he is ready.",
          D: "I wonder whether he ready is."
        },
        answer: "C",
        explanation: "whether / if 後面也是陳述句語序：he is ready。"
      },
      {
        id: 10,
        question: "Please tell me _____ English.",
        options: {
          A: "whether he speak",
          B: "whether does he speak",
          C: "whether did he speak",
          D: "whether he speaks"
        },
        answer: "D",
        explanation: "一般現在式第三人稱單數要用 speaks。"
      },
      {
        id: 11,
        question: "I want to know _____ .",
        options: {
          A: "when the bus will come",
          B: "when does the bus come",
          C: "when the bus come",
          D: "when will the bus come"
        },
        answer: "A",
        explanation: "未來式間接問句一樣用陳述句語序：the bus will come。"
      },
      {
        id: 12,
        question: "下列哪一項說明正確？",
        options: {
          A: "間接問句可以自己決定整句的標點符號",
          B: "間接問句一定要用問號結尾",
          C: "間接問句後面只能接驚嘆號",
          D: "間接問句不能決定句子的標點符號"
        },
        answer: "D",
        explanation: "標點符號由整句句型決定，不是由間接問句單獨決定。"
      },
      {
        id: 13,
        question: "We don’t know _____ .",
        options: {
          A: "if does she like music",
          B: "if did she like music",
          C: "if she likes music",
          D: "if she like music does"
        },
        answer: "C",
        explanation: "if 後面仍用陳述句語序 she likes music。"
      },
      {
        id: 14,
        question: "The teacher asked _____ .",
        options: {
          A: "why did Tom late",
          B: "why Tom late was",
          C: "why was Tom late",
          D: "why Tom was late"
        },
        answer: "D",
        explanation: "間接問句要用陳述句語序：Tom was late。"
      },
      {
        id: 15,
        question: "下列哪一句中的畫線部分可視為及物動詞的受詞？",
        options: {
          A: "The boy who is singing is my brother.",
          B: "I left because it was raining.",
          C: "Do you know where he went last night?",
          D: "Where he went last night is a mystery."
        },
        answer: "C",
        explanation: "在 C 句中，where he went last night 當 know 的受詞。"
      }
    ];

    let showAnswerNotes = false;

    function renderQuiz() {
      const container = document.getElementById("quizContainer");
      container.innerHTML = "<h2>試題區</h2>";

      questions.forEach(q => {
        const div = document.createElement("div");
        div.className = "question";
        div.id = `question-${q.id}`;

        let optionsHtml = "";
        for (const [key, value] of Object.entries(q.options)) {
          optionsHtml += `
            <label class="option" id="q${q.id}-${key}">
              <input type="radio" name="q${q.id}" value="${key}">
              (${key}) ${value}
            </label>
          `;
        }

        div.innerHTML = `
          <div class="question-number">${q.id}. ${q.question}</div>
          <div>${optionsHtml}</div>
          <div class="answer-note hidden" id="note-${q.id}"></div>
        `;

        container.appendChild(div);
      });
    }

    function submitQuiz() {
      let score = 0;
      let answeredCount = 0;

      questions.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        const note = document.getElementById(`note-${q.id}`);

        for (const key of Object.keys(q.options)) {
          document.getElementById(`q${q.id}-${key}`).classList.remove("correct", "incorrect");
        }

        if (selected) {
          answeredCount++;
          const chosen = selected.value;
          if (chosen === q.answer) {
            score++;
            document.getElementById(`q${q.id}-${chosen}`).classList.add("correct");
          } else {
            document.getElementById(`q${q.id}-${chosen}`).classList.add("incorrect");
            document.getElementById(`q${q.id}-${q.answer}`).classList.add("correct");
          }
        }

        note.innerHTML = `正確答案：<strong>${q.answer}</strong><br>解析：${q.explanation}`;
        if (showAnswerNotes) {
          note.classList.remove("hidden");
        } else {
          note.classList.add("hidden");
        }
      });

      const studentClass = document.getElementById("studentClass").value.trim() || "未填寫班級";
      const studentName = document.getElementById("studentName").value.trim() || "未填寫姓名";
      const studentSeat = document.getElementById("studentSeat").value.trim() || "未填寫座號";

      const resultBox = document.getElementById("resultBox");
      resultBox.style.display = "block";
      resultBox.innerHTML = `
        <div class="score-line">成績：${score} / ${questions.length}</div>
        <div>班級：${studentClass}｜姓名：${studentName}｜座號：${studentSeat}</div>
        <div>已作答：${answeredCount} / ${questions.length}</div>
      `;

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetQuiz() {
      document.querySelectorAll('input[type="radio"]').forEach(input => input.checked = false);
      document.querySelectorAll('.option').forEach(opt => opt.classList.remove("correct", "incorrect"));
      document.querySelectorAll('.answer-note').forEach(note => {
        note.classList.add("hidden");
        note.innerHTML = "";
      });
      document.getElementById("resultBox").style.display = "none";
      document.getElementById("resultBox").innerHTML = "";
    }

    function toggleAnswers() {
      showAnswerNotes = !showAnswerNotes;
      questions.forEach(q => {
        const note = document.getElementById(`note-${q.id}`);
        if (!note.innerHTML) {
          note.innerHTML = `正確答案：<strong>${q.answer}</strong><br>解析：${q.explanation}`;
        }
        if (showAnswerNotes) {
          note.classList.remove("hidden");
        } else {
          note.classList.add("hidden");
        }
      });
    }

    renderQuiz();
  </script>
</body>
</html>
